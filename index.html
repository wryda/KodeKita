    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Pasang tema sebelum halaman tampil agar tidak berkedip -->
    <script>
      try {
        document.documentElement.dataset.tema = localStorage.getItem("kodekita.tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "gelap" : "terang");
      } catch (e) {}
    </script>

  <body data-auth="tamu">

    </main>

    <div data-muat="html/footer.html"></div>

    <div data-muat="html/akun-dialog.html"></div>

    <div class="toast" id="toast" role="status" hidden></div>
