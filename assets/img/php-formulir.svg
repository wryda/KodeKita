<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Alur formulir PHP: data dikirim dengan POST, dibaca lewat $_POST, lalu ditampilkan"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f70"/></marker></defs><rect width="720" height="300" fill="#f3f8f7"/><rect x="20" y="70" width="180" height="140" rx="14" fill="#ffffff" stroke="#d8e6e1" stroke-width="2"/><text x="110" y="100" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#087f70" text-anchor="middle">Formulir</text><text x="110" y="135" font-family="Consolas,Menlo,Monaco,monospace" font-size="13" font-weight="500" fill="#183b35" text-anchor="middle">nama = "Sari"</text><text x="110" y="159" font-family="Consolas,Menlo,Monaco,monospace" font-size="13" font-weight="500" fill="#183b35" text-anchor="middle">[ Kirim ]</text><rect x="270" y="70" width="180" height="140" rx="14" fill="#087f70" stroke="#087f70" stroke-width="2"/><text x="360" y="100" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Server + PHP</text><text x="360" y="135" font-family="Consolas,Menlo,Monaco,monospace" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">$_POST["nama"]</text><text x="360" y="159" font-family="Consolas,Menlo,Monaco,monospace" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">htmlspecialchars()</text><rect x="520" y="70" width="180" height="140" rx="14" fill="#d9f5e9" stroke="#d8e6e1" stroke-width="2"/><text x="610" y="100" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#087f70" text-anchor="middle">Tampil di halaman</text><text x="610" y="135" font-family="Consolas,Menlo,Monaco,monospace" font-size="13" font-weight="500" fill="#183b35" text-anchor="middle">Halo, Sari!</text><line x1="204" y1="125" x2="266" y2="125" stroke="#087f7