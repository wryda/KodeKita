Dewi</text><rect x="220" y="170" width="90" height="38" rx="0" fill="#fff3b0" stroke="#d8e6e1" stroke-width="1.5"/><text x="265.0" y="194.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#183b35" text-anchor="middle">X</text><rect x="310" y="170" width="90" height="38" rx="0" fill="#fff3b0" stroke="#d8e6e1" stroke-width="1.5"/><text x="355.0" y="194.0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#183b35" text-anchor="middle">95</text><text x="60" y="236" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5b756e" text-anchor="start">Budi tidak lolos: kelasnya XI dan nilainya di bawah 75</text><line x1="412" y1="113" x2="468" y2="113" stroke="#087f70" stroke-width="2.5" marker-end="url(#a)"/><line x1="412" y1="189" x2="468" y2="150" stroke="#087f70" stroke-width="2.5" marker-end="url(#a)"/><rect x="470" y="70" width="210" height="130" rx="14" fill="#ffffff" stroke="#087f70" stroke-width="2"/><text x="575" y="98" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#087f70" text-anchor="middle">Hasil query</text><text x="575" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#183b35" text-anchor="middle">Dewi  –  95</text><text x="575" y="158" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#183b35" text-anchor="middle">Sari  –  88</text><text x="575" y="184" font-family="Consolas,Menlo,Monaco,monospace" font-size="12" font-weight="600" fill="#5b756e" text-anchor="middle">ORDER BY nilai DESC</text><text x="60" y="270" font-family="Consolas,Menlo,Monaco,monospace" font-size="14" font-weight="800" fill="#183b35" text-anchor="start">WHERE kelas = 'X' AND nilai &gt;= 75</text></svg>