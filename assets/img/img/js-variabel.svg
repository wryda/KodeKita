<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Alur klik tombol: onclick mengubah variabel lalu memperbarui halaman"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f70"/></marker></defs><rect width="720" height="300" fill="#f3f8f7"/><rect x="30" y="50" width="190" height="90" rx="14" fill="#ffffff" stroke="#d8e6e1" stroke-width="2"/><text x="125" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#087f70" text-anchor="middle">Pengguna klik</text><text x="125" y="114" font-family="Consolas,Menlo,Monaco,monospace" font-size="11.5" font-weight="500" fill="#183b35" text-anchor="middle">tombol "Tambah satu"</text><rect x="265" y="50" width="190" height="90" rx="14" fill="#ffffff" stroke="#d8e6e1" stroke-width="2"/><text x="360" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#087f70" text-anchor="middle">onclick berjalan</text><text x="360" y="114" font-family="Consolas,Menlo,Monaco,monospace" font-size="11.5" font-weight="500" fill="#183b35" text-anchor="middle">nilai = nilai + 1</text><rect x="500" y="50" width="190" height="90" rx="14" fill="#ffffff" stroke="#d8e6e1" stroke-width="2"/><text x="595" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#087f70" text-anchor="middle">Halaman berubah</text><text x="595" y="114" font-family="Consolas,Menlo,Monaco,monospace" font-size="11.5" font-weight="500" fill="#183b35" text-anchor="middle">angka.textContent = nilai</text><line x1="224" y1="95" x2="262" y2="95" stroke="#087f70" stroke-width="2.5" marker-end="url(#a)"/><line x1="459" y1="95" x2="497" y2="95" stroke="#087f70" stroke-width="2.5" marker-end="url(#a)"/><rect x="265" y="190" width="190" height="70" rx="14" fill="#f5dc55" stroke="#d9a400" stroke-width="2"/><text x="360" y="218" font-family="Arial,Helvetica,san